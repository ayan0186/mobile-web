<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Glamor Salon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Glamor Salon</span>
            <span class="navbar-text text-white me-3" id="welcomeName"></span>
            <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>My Appointments</h2>
        <a href="booking.html" class="btn btn-primary mb-4">Book New Appointment</a>

        <div id="appointmentsList"></div>
        <div id="appointmentsError" class="alert alert-danger mt-3" style="display:none;"></div>
        <div id="successMessage" class="alert alert-success mt-3" style="display:none;"></div>
        <div id="errorMessage" class="alert alert-danger mt-3" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- utils.js must be first -->
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
