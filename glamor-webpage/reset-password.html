<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Glamor Salon</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="signin-page">
      <section class="signin-card">
        <h1>Reset password</h1>
        <p>Enter the email address associated with your account and we’ll send a password reset link.</p>
        <form action="#" method="post">
          <div class="form-group">
            <label for="reset-email">Email address</label>
            <input type="email" id="reset-email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Send reset email</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
