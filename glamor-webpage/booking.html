
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking | Glamor Salon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Glamor Salon</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<main class="signin-page">
  <section class="signin-card">
    <h1>Welcome, <span id="customerName"></span></h1>
    <p>Book your appointment below.</p>

    <p id="errorMessage" class="text-danger" style="display:none;"></p>
    <p id="successMessage" class="text-success" style="display:none;"></p>

<form id="bookingForm">
  <div class="form-group">
    <label for="appointmentDate">Choose a date *</label>
    <input type="date" id="appointmentDate" name="appointmentDate" required />
  </div>

  <div class="form-group">
    <label for="appointmentTime">Choose a time *</label>
    <input type="time" id="appointmentTime" name="appointmentTime" required />
  </div>

  <div class="form-group">
    <label for="beauticianSelect">Preferred beautician (optional)</label>
    <select id="beauticianSelect" name="beauticianSelect">
      <option value="">No preference</option>
      <!-- You can manually add IDs here from your Beauticians table -->
      <option value="1">Jane Smith</option> 
    </select>
  </div>

  <div class="form-actions">
    <button type="submit" class="primary-btn">Book Now</button>
  </div>
</form>
  </section>
</main>

<script src="js/utils.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
