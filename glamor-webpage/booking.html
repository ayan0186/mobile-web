
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking | Glamor Salon</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="signin-page">
  <section class="signin-card">
    <h1>Welcome, <span id="customerName"></span></h1>
    <p>Book your appointment below.</p>

    <p id="errorMessage"   style="color:red;   display:none;"></p>
    <p id="successMessage" style="color:green; display:none;"></p>

    <!-- booking.html -->
<form id="bookingForm" action="process_booking.php" method="POST">
  <div class="form-group">
    <label for="appointmentDate">Choose a date *</label>
    <input type="date" id="appointmentDate" name="appointmentDate" required />
  </div>

  <div class="form-group">
    <label for="appointmentTime">Choose a time *</label>
    <input type="time" id="appointmentTime" name="appointmentTime" required />
  </div>

  <div class="form-group">
    <label for="beauticianSelect">Preferred beautician (optional)</label>
    <select id="beauticianSelect" name="beauticianSelect">
      <option value="">No preference</option>
      <!-- You can manually add IDs here from your Beauticians table -->
      <option value="1">Jane Smith</option> 
    </select>
  </div>

  <div class="form-actions">
    <button type="submit" class="primary-btn">Book Now</button>
  </div>
</form>
  </section>
</main>

<script src="js/utils.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
